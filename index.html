<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKOS v5.2 Unified Desktop</title>
    <style>
        :root {
            --bg: #05070d;
            --panel: #101726;
            --panel-2: #141c2e;
            --text: #e8eef9;
            --muted: #7b90b2;
            --cyan: #00f0ff;
            --magenta: #ff2ea6;
            --green: #00ff88;
            --amber: #ffc857;
            --red: #ff4d6d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top, #15213a 0%, var(--bg) 70%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        .shell { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        header { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; background:rgba(16,23,38,.95); border:1px solid rgba(0,240,255,.25); border-radius:14px; }
        h1 { margin:0; font-size:1.3rem; color:var(--cyan); }
        .badge { padding:7px 12px; border-radius:999px; font-size:.85rem; font-weight:700; border:1px solid transparent; }
        .badge.live { color:var(--green); border-color:rgba(0,255,136,.35); background:rgba(0,255,136,.08); }
        .badge.offline { color:var(--amber); border-color:rgba(255,200,87,.35); background:rgba(255,200,87,.08); }
        .grid { display:grid; grid-template-columns: 1.2fr .8fr; gap:16px; }
        .card { background:rgba(16,23,38,.95); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px; }
        .card h2 { margin:0 0 10px; font-size:1rem; color:var(--magenta); }
        .row { display:flex; justify-content:space-between; margin:8px 0; color:var(--muted); }
        .value { color:var(--text); font-weight:700; }
        .actions { display:flex; gap:10px; flex-wrap:wrap; }
        button { background:linear-gradient(135deg, var(--cyan), #4edcff); color:#031018; border:none; border-radius:999px; padding:10px 14px; font-weight:700; cursor:pointer; }
        button.secondary { background:linear-gradient(135deg, var(--magenta), #ff6db7); color:white; }
        canvas { width:100%; height:220px; background:#060811; border:1px solid rgba(255,255,255,.08); border-radius:10px; margin-top:8px; }
        .footer { font-size:.88rem; color:var(--muted); }
    </style>
</head>
<body>
<div class="shell">
    <header>
        <div>
            <h1>KKOS v5.2 Unified Desktop</h1>
            <div class="footer">DAW • Game Engine • Runtime Control Pane</div>
        </div>
        <div id="statusBadge" class="badge offline">Offline</div>
    </header>

    <div class="grid">
        <div class="card">
            <h2>Runtime Controls</h2>
            <div class="actions">
                <button onclick="window.open('file:///C:/Users/jaile/Downloads/KKOS_v5.2_Unified_Bundle/run_kkos_unified.bat')">Launch Bundle</button>
                <button class="secondary" onclick="window.open('file:///C:/Users/jaile/Downloads/KKOS_v5.2_Unified_Bundle/start-kkos-only.bat')">Launch KKOS</button>
            </div>
            <div class="row"><span>Engine</span><span class="value" id="engineState">Standby</span></div>
            <div class="row"><span>Audio Layer</span><span class="value" id="audioState">Ready</span></div>
            <div class="row"><span>Game Layer</span><span class="value" id="gameState">Ready</span></div>
        </div>
        <div class="card">
            <h2>Kernel Metrics</h2>
            <div class="row"><span>Coherence</span><span class="value" id="lbl-score">0%</span></div>
            <div class="row"><span>Shard Array</span><span class="value" id="lbl-shards">0</span></div>
            <div class="row"><span>Boost</span><span class="value" id="lbl-boost">0.000</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Coherence Timeline</h2>
        <canvas id="driftCanvas"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('driftCanvas');
    const ctx = canvas.getContext('2d');
    const trend = [];
    const maxSamples = 120;

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        drawGraph();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        for (let i = 1; i < 4; i++) {
            const y = (canvas.height / 4) * i;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        if (trend.length === 0) return;
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const step = canvas.width / (maxSamples - 1);
        trend.forEach((value, idx) => {
            const x = idx * step;
            const y = canvas.height - (value * canvas.height);
            if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    function updateMetric(score) {
        document.getElementById('lbl-score').textContent = score + '%';
        document.getElementById('lbl-shards').textContent = Math.max(1, Math.round(score / 10));
        document.getElementById('lbl-boost').textContent = (score / 100).toFixed(3);
        trend.push(score / 100);
        if (trend.length > maxSamples) trend.shift();
        drawGraph();
    }

    function setStatus(online) {
        const badge = document.getElementById('statusBadge');
        if (online) {
            badge.textContent = 'Live';
            badge.className = 'badge live';
        } else {
            badge.textContent = 'Offline';
            badge.className = 'badge offline';
        }
    }

    setStatus(false);
    resizeCanvas();
    setInterval(() => {
        const score = Math.min(100, Math.max(20, Math.round(45 + Math.sin(Date.now()/2400) * 20 + Math.random()*8)));
        updateMetric(score);
        setStatus(true);
    }, 900);
</script>
</body>
</html>
